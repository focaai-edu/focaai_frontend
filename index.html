<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/cerebro.png" />
    <title>foca.ai</title>
    <script>
      // Tema antes do primeiro paint, sem clarão branco (#18). Mesma regra de
      // initialTheme() em src/lib/theme.js (theme.test.js trava a paridade).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('foca-theme-preference'); } catch (e) { /* storage bloqueado */ }
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
